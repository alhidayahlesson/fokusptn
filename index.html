<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StudyFlow — Belajar Terarah</title>
<style>
:root {
  --bg: #f6f7fb;
  --card: #ffffff;
  --text: #182033;
  --muted: #6b7280;
  --line: #e7e9ef;
  --primary: #635bff;
  --primary2: #5148e5;
  --primary-soft: #eeedff;
  --green: #16834b;
  --green-soft: #eaf8ef;
  --yellow: #a66500;
  --yellow-soft: #fff4dd;
  --red: #bd3030;
  --red-soft: #fff0f0;
  --sidebar-w: 250px;
  --topbar-h: 64px;
  --radius: 16px;
  --shadow: 0 8px 28px rgba(20,25,40,.06);
}
[data-theme="dark"] {
  --bg: #0f1219;
  --card: #1a1f2e;
  --text: #e8eaef;
  --muted: #9ca3af;
  --line: #2a3142;
  --primary: #7c75ff;
  --primary2: #6b63f0;
  --primary-soft: #2a2748;
  --green-soft: #1a2e24;
  --yellow-soft: #2e2618;
  --red-soft: #2e1a1a;
  --shadow: 0 8px 28px rgba(0,0,0,.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; border: none; background: none; }
.hidden { display: none !important; }
.app { min-height: 100vh; }

/* Topbar */
.topbar {
  height: var(--topbar-h);
  background: var(--card);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: sticky;
  top: 0;
  z-index: 40;
}
.logo {
  font-size: 20px;
  font-weight: 900;
  cursor: pointer;
  letter-spacing: -0.02em;
}
.logo span { color: var(--primary); }
.top-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  border-radius: 12px;
  padding: 10px 16px;
  font-weight: 700;
  font-size: 14px;
  transition: .15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:active { transform: scale(0.97); }
.primary { background: var(--primary); color: #fff; }
.primary:hover { background: var(--primary2); }
.secondary { background: var(--primary-soft); color: var(--primary2); }
.ghost { background: transparent; color: var(--muted); }
.ghost:hover { color: var(--text); background: var(--bg); }
.danger { background: var(--red-soft); color: var(--red); }
.sm { padding: 8px 12px; font-size: 13px; }

/* Layout */
.layout { display: flex; }
.sidebar {
  width: var(--sidebar-w);
  min-height: calc(100vh - var(--topbar-h));
  background: var(--card);
  border-right: 1px solid var(--line);
  padding: 16px 12px;
  position: fixed;
  top: var(--topbar-h);
  bottom: 0;
  overflow-y: auto;
  z-index: 30;
}
.nav { display: grid; gap: 4px; }
.nav button {
  width: 100%;
  text-align: left;
  padding: 11px 14px;
  border-radius: 12px;
  color: var(--muted);
  font-weight: 650;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav button.active, .nav button:hover {
  background: var(--primary-soft);
  color: var(--primary2);
}
.side-card {
  margin-top: 18px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
}
.side-card b { font-size: 15px; }
.side-card p { font-size: 12px; color: var(--muted); margin-top: 4px; }

.content {
  margin-left: var(--sidebar-w);
  width: calc(100% - var(--sidebar-w));
  padding: 28px 24px 100px;
  min-height: calc(100vh - var(--topbar-h));
}
.container { max-width: 960px; margin: 0 auto; }

/* Landing */
.hero {
  padding: 48px 0 36px;
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 40px;
  align-items: center;
}
.eyebrow {
  display: inline-block;
  background: var(--primary-soft);
  color: var(--primary2);
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.hero h1 {
  font-size: clamp(36px, 5.5vw, 58px);
  line-height: 1.05;
  margin: 16px 0 12px;
  letter-spacing: -0.03em;
}
.hero h1 span { color: var(--primary); }
.hero p { font-size: 17px; color: var(--muted); line-height: 1.65; margin-bottom: 22px; }

/* Cards & UI */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.stat strong { display: block; font-size: 26px; letter-spacing: -0.02em; }
.stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
.muted { color: var(--muted); }
.progress {
  height: 8px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 8px;
}
.progress > div {
  height: 100%;
  background: var(--primary);
  border-radius: 99px;
  transition: width .4s ease;
}
.grid { display: grid; gap: 12px; }
.grid2 { grid-template-columns: repeat(2, 1fr); }
.grid3 { grid-template-columns: repeat(3, 1fr); }
.grid4 { grid-template-columns: repeat(4, 1fr); }

.subject-card, .topic-card, .chapter-card {
  cursor: pointer;
  transition: .15s;
}
.subject-card:hover, .topic-card:hover, .chapter-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(20,25,40,.1);
}
.icon {
  width: 46px;
  height: 46px;
  border-radius: 13px;
  background: var(--primary-soft);
  color: var(--primary);
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 18px;
}
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
}
.lots { background: var(--green-soft); color: var(--green); }
.mots { background: var(--yellow-soft); color: var(--yellow); }
.hots { background: var(--red-soft); color: var(--red); }
.lock { background: var(--line); color: var(--muted); }

.topic-row {
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--card);
  transition: .15s;
}
.topic-row:hover { border-color: var(--primary); background: var(--primary-soft); }
.num {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: var(--bg);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 14px;
  flex-shrink: 0;
}

/* Lesson */
.lesson { max-width: 780px; margin: 0 auto; }
.lesson h1 { font-size: 34px; margin: 8px 0 6px; letter-spacing: -0.02em; }
.lesson h2 { margin-top: 24px; font-size: 18px; }
.formula {
  padding: 18px;
  background: var(--primary-soft);
  border-radius: 12px;
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  margin: 12px 0;
}
.choice {
  display: block;
  width: 100%;
  padding: 13px 16px;
  text-align: left;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  margin-top: 8px;
  font-weight: 550;
  transition: .12s;
}
.choice:hover { border-color: var(--primary); background: var(--primary-soft); }
.choice.selected { border-color: var(--primary); background: var(--primary-soft); }
.choice.correct { border-color: #35a66c; background: var(--green-soft); }
.choice.wrong { border-color: #e55; background: var(--red-soft); }
.question { margin-bottom: 12px; }
.notice {
  padding: 13px 16px;
  border-radius: 12px;
  background: var(--primary-soft);
  color: var(--primary2);
  font-size: 14px;
}

/* Schedule */
.schedule-item {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  display: grid;
  grid-template-columns: 120px 1fr auto;
  gap: 12px;
  align-items: center;
}

/* Focus */
.focus-screen {
  text-align: center;
  padding: 40px 20px;
  max-width: 420px;
  margin: 0 auto;
}
.focus-timer {
  font-size: 64px;
  font-weight: 900;
  letter-spacing: -0.03em;
  margin: 20px 0;
  font-variant-numeric: tabular-nums;
}
.focus-controls { display: flex; gap: 10px; justify-content: center; margin-top: 24px; }

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(10,15,30,.5);
  display: grid;
  place-items: center;
  z-index: 60;
  padding: 20px;
  backdrop-filter: blur(4px);
}
.modalbox {
  background: var(--card);
  border-radius: 18px;
  width: min(440px, 100%);
  padding: 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,.2);
}
.input, .textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 11px;
  margin-top: 6px;
  background: var(--bg);
  color: var(--text);
}
.textarea { min-height: 90px; resize: vertical; }

/* Toast */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text);
  color: var(--card);
  padding: 12px 20px;
  border-radius: 12px;
  font-weight: 650;
  font-size: 14px;
  z-index: 100;
  opacity: 0;
  transition: .3s;
  pointer-events: none;
  max-width: 90%;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Bottom nav mobile */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--line);
  padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  z-index: 40;
  justify-content: space-around;
}
.bottom-nav button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 4px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 650;
}
.bottom-nav button.active { color: var(--primary); }
.bottom-nav button span { font-size: 18px; }

/* Achievement card */
.ach-card {
  text-align: center;
  padding: 18px 12px;
  min-height: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  opacity: .45;
  transition: .2s;
}
.ach-card.unlocked { opacity: 1; }
.ach-card .ach-icon { font-size: 28px; }

/* Confetti canvas */
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 200; }

/* Empty */
.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--muted);
}
.empty .big { font-size: 40px; margin-bottom: 12px; }

/* Mobile */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .content {
    margin-left: 0;
    width: 100%;
    padding: 20px 14px 90px;
  }
  .bottom-nav { display: flex; }
  .hero { grid-template-columns: 1fr; gap: 24px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .grid3, .grid2, .grid4 { grid-template-columns: 1fr; }
  .topbar { padding: 0 14px; }
  .top-actions .btn:not(.primary):not(.icon-btn) { display: none; }
  .schedule-item { grid-template-columns: 1fr; }
  .hero h1 { font-size: 36px; }
  .lesson h1 { font-size: 28px; }
}
@media (min-width: 901px) {
  .bottom-nav { display: none !important; }
}

/* Search */
.search-box {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--text);
  margin-bottom: 16px;
}
</style>
</head>
